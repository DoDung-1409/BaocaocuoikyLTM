# Render Blueprint - PHƯƠNG ÁN MIỄN PHÍ (chi phí 0đ nếu dùng đúng hạn mức):
#   Backend : Render Web Service gói FREE (không Persistent Disk, không database của Render)
#   Database: Neon PostgreSQL gói Free  -> đặt DATABASE_URL (và DIRECT_DATABASE_URL) trong Dashboard
#   Chat chỉ lưu tin nhắn văn bản; ảnh đại diện lưu cục bộ.
# Các biến `sync: false` KHÔNG nằm trong repo: Render sẽ hỏi bạn nhập khi tạo Blueprint (an toàn, không lộ secret).
# Xem docs/DEPLOY_FREE.md để biết từng bước và các giới hạn của gói Free.
services:
  - type: web
    name: connecthub
    runtime: python
    plan: free
    region: singapore            # nên chọn cùng khu vực với Neon (AWS ap-southeast-1) để giảm độ trễ
    buildCommand: pip install -r requirements.txt
    # Migration dùng kết nối TRỰC TIẾP của Neon (không qua pooler); nếu không đặt DIRECT_DATABASE_URL thì dùng DATABASE_URL.
    # 1 worker + nhiều thread: presence/rate-limit lưu trong RAM (xem README mục "Vì sao 1 worker").
    startCommand: DATABASE_URL="${DIRECT_DATABASE_URL:-$DATABASE_URL}" flask db upgrade && gunicorn --worker-class gthread --threads 100 --workers 1 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    # /healthz KHÔNG chạm database để health check không đánh thức Neon (Neon Free có hạn mức giờ compute).
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_APP
        value: wsgi.py
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # --- nhập trong Render Dashboard (secret, không commit) ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
